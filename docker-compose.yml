version: '3.9'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: drive-server
    ports:
      - "8080:8080"
    volumes:
      - ./my_storage_data:/usr/src/app/my_storage
    networks:
      - drive-network
    environment:
      - THREAD_POOL_SIZE=5

  mongo:
    image: mongo:7
    container_name: drive-mongo
    ports:
      - "27017:27017"  
    volumes:
      - mongo-data:/data/db
    networks:
      - drive-network

  web-server:
    build:
      context: ./web-server
      dockerfile: Dockerfile.webServer
    ports:
      - "5000:5000"
    environment:
      - CPP_SERVER_HOST=server
      - CPP_SERVER_PORT=8080
      - JWT_SECRET=SecretKeyForJWTs123
      - CONNECTION_STRING=mongodb://mongo:27017/drive
    depends_on:
      - server
      - mongo
    networks:
      - drive-network

  client-react:
    build:
      context: ./client-react
    ports:
      - "3000:3000"
    depends_on:
      - web-server
    networks:
      - drive-network

  client-mobile:
    build:
      context: ./clientMobile
      dockerfile: Dockerfile
    ports:
      - "19000:19000"  # Metro Bundler
      - "19001:19001"  # DevTools
      - "19002:19002"  # Tunnel
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP}
      - EXPO_PUBLIC_API_URL=http://${HOST_IP}:5000/api
    volumes:
      - ./clientMobile:/opt/react_native_app:cached
      - /opt/react_native_app/node_modules
    tty: true
    command: npx expo start --lan --port 19000
    depends_on:
      - web-server
    networks:
      - drive-network



networks:
  drive-network:
    driver: bridge

volumes:
  mongo-data:
